<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>Welcome, {{ user.username }} 👋</h2>
        <div class="card p-4">
            <h4>Balance: <strong>R {{ user.balance }}</strong></h4>
        </div>

        <!-- Deposit Form -->
        <div class="mt-4">
            <form action="{{ url_for('deposit') }}" method="POST">
                <input type="number" name="amount" class="form-control" placeholder="Deposit Amount" required>
                <button type="submit" class="btn btn-success mt-2 w-100">Deposit</button>
            </form>
        </div>

         <!-- Withdraw Form -->
        <div class="mt-4">
            <form action="{{ url_for('withdraw') }}" method="POST">
                <input type="number" name="amount" class="form-control" placeholder="Withdraw Amount" required>
                <button type="submit" class="btn btn-danger mt-2 w-100">Withdraw</button>
            </form>
        </div>

        <!-- Transaction History Section -->

        <div  class="card mt-4 shadow-sm">
            <a href="{{ url_for('transactions') }}" class="btn btn-info">View Statement</a>
        </div>

        <!-- Transfer Money -->
        <form action="{{ url_for('transfer') }}" method="POST" class="mt-4">
            <input type="text" name="recipient" class="form-control mb-2" placeholder="Recipient Username" required>
            <input type="number" name="amount" class="form-control mb-2" placeholder="Transfer Amount" required>
            <button type="submit" class="btn btn-primary w-100">Transfer</button>
        </form>                        

        <!-- Logout Button -->
        <div class="mt-4 text-left">
            <a href="{{ url_for('logout') }}" class="btn btn-secondary">Logout</a>
        </div>    
    </div>
</body>
</html>
